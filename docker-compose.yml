# Lokale Entwicklungs-Datenbanken. Start: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hausanna
      POSTGRES_PASSWORD: hausanna
      POSTGRES_DB: hausanna
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hausanna']
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mongo-data:

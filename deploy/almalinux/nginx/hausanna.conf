# Haus Anna – nginx (HTTPS). Ziel: /etc/nginx/conf.d/hausanna.conf
# __DOMAIN__ wird von install.sh ersetzt.

# Upstreams (nur lokal)
upstream hausanna_web { server 127.0.0.1:3001; keepalive 16; }
upstream hausanna_api { server 127.0.0.1:3000; keepalive 16; }

# HTTP -> HTTPS (+ Let's-Encrypt-Prüfung)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www -> ohne www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hausanna_ssl:10m;
    ssl_session_timeout 1d;

    # Sicherheits-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Kompression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/calendar;

    access_log /var/log/nginx/hausanna.access.log;
    error_log  /var/log/nginx/hausanna.error.log warn;

    # API (inkl. Uploads bis 20 MB, Webhooks, iCal-Export)
    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://hausanna_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hochgeladene Bilder
    location /media/ {
        alias /var/lib/hausanna/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    # Admin-Panel (statische SPA)
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /opt/hausanna/apps/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location /admin/assets/ {
        alias /opt/hausanna/apps/admin/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Öffentliche Webseite (SSR)
    location / {
        proxy_pass http://hausanna_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

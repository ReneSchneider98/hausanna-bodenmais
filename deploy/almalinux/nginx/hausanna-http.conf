# Haus Anna – nginx Übergangs-Konfiguration (nur HTTP, ohne Zertifikat).
# Wird von install.sh verwendet, solange noch kein Let's-Encrypt-Zertifikat
# existiert (z. B. weil die Domain noch auf das alte WordPress zeigt).
# Danach ersetzt install.sh diese Datei durch hausanna.conf (HTTPS).

upstream hausanna_web { server 127.0.0.1:3001; keepalive 16; }
upstream hausanna_api { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://hausanna_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/lib/hausanna/uploads/;
        expires 30d;
        try_files $uri =404;
    }

    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /opt/hausanna/apps/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        proxy_pass http://hausanna_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
